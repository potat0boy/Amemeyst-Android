name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Patch files
        run: |
          patch ./Amemeyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/tasks/MinecraftDownloader.java ./Amemeyst-Android/MinecraftDownloader.patch
          patch ./Amemeyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/Tools.java ./Amemeyst-Android/Tools.patch

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "8.11"

      - name: Run scripts
        run: |
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Release APK
        run: |
          # Passing the password secret directly to gradle so it can sign the APK
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.injected.signing.store.password=${{ secrets.GPLAY_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.password=${{ secrets.GPLAY_KEYSTORE_PASSWORD }} \
            --no-daemon -x lint
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/app-release.apk

      - name: Build Debug APK
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon -x lint
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-release.apk > out/app-release.md5
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-recommended
          path: out/app-debug.*

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release.*
